version: 2
updates:
  # The one package dependency, Catchlight-Core, is a range the apps' exact Core
  # pins decide (Package.resolved is gitignored), so the only versions to keep
  # current here are the workflow actions' commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
