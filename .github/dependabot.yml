version: 2
updates:
  # The one package dependency, Catchlight-Core, is a range the apps' exact Core
  # pins decide (Package.resolved is gitignored), so the only versions to keep
  # current here are the workflow actions' commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    ignore:
      # The review workflow pins this action by commit. A bump arrives only through a reviewed update.
      - dependency-name: "anthropics/claude-code-action"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
