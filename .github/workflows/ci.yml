name: CI

# Two jobs: the package's tests on macOS (`swift test`, the Mac app's platform)
# and on the iOS simulator (`xcodebuild test`, the iPhone app's), oldest and
# newest runtimes. The Keychain suite skips in both: the data-protection
# keychain needs a signed, entitled host, which each app's hosted tests provide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: AppleStorage on macOS (swift test)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift test
        run: swift test

  ios-tests:
    name: AppleStorage on iOS (xcodebuild test)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          - 'platform=iOS Simulator,name=iPhone 16,OS=latest'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE"

      # xcodebuild waits about 60 seconds for the destination and then gives up.
      # On a fresh runner CoreSimulator can take longer than that to publish its
      # devices, and xcodebuild then lists no simulators at all and exits 70
      # ("Unable to find a device matching the provided destination specifier").
      # It hit either leg at random on the same image: the 18.5 leg on main
      # (run 37157924540), the latest leg on PR #2 (run 37157970718). Asking
      # simctl first starts the service, and the loop waits until the leg's
      # iPhone 16 is listed. The matrix strings are required status checks on
      # main, so they stay as they are.
      - name: Wait for the simulator
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          OS=$(sed -n 's/.*OS=\([^,]*\).*/\1/p' <<< "$DESTINATION")
          for _ in $(seq 1 36); do
            LIST=$(xcrun simctl list devices available || true)
            if [ "$OS" = latest ]; then
              grep -q '^    iPhone 16 (' <<< "$LIST" && FOUND=1
            else
              awk -v h="-- iOS $OS --" '/^-- /{s=($0==h)} s' <<< "$LIST" | grep -q '^    iPhone 16 (' && FOUND=1
            fi
            [ -n "${FOUND:-}" ] && break
            sleep 5
          done
          grep -E '^-- iOS|^    iPhone 16 \(' <<< "$LIST" || true
          if [ -z "${FOUND:-}" ]; then
            echo "::error::No iPhone 16 simulator for OS=$OS after 3 minutes."
            exit 1
          fi

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -scheme CatchlightAppleStorage \
            -destination '${{ matrix.destination }}'
